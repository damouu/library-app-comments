name: Tests

on:
  push:
    branches:
      - test

jobs:
  Test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: testing
      MONGO_URI: "mongodb://127.0.0.1:27017/comments"

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Inject JWT Keys from Secrets
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          umask 077
          mkdir -p keys
          printf '%s' "$JWT_PRIVATE_KEY" > keys/private.pem
          printf '%s' "$JWT_PUBLIC_KEY" > keys/public.pem

      - name: Run test suite
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: pull-request
        if: ${{ success() }}
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5
        env:
          GITHUB_TOKEN: ${{ secrets.MYWORKFLOW }}
        with:
          source_branch: "test"
          destination_branch: "main"
          pr_title: ${{ github.event.head_commit.message }}
          pr_body: ${{ github.event.head_commit.message }}
          pr_label: "Staging,TestsPassed"
          pr_assignee: "damouu"

      - name: move youtrack-test-failed
        if: ${{ failure() }}
        uses: bloobirds-it/action-youtrack-move@2d323980954263fb5ee24772d66207387a21ae12
        with:
          github-token: ${{ secrets.MYWORKFLOW }}
          yt-url: ${{ secrets.YOUTRACK_URL }}
          yt-token: ${{ secrets.YOUTRACK_TOKEN }}
          yt-project-id: "LAP"
          yt-column-triggers: "Test"
          yt-column-target: "TestFailed"